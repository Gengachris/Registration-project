
version: '3.8'
services:
 registration-app:
   image: gengachris24/registration-app:latest
   ports:
      - 5000:5000
   environment:
      - NODE_ENV=production
   depends_on:
      - mongo

 mongo:
   image: mongo:latest
   ports:
      - 27017:27017
   environment:
    - MONGO_INITDB_ROOT_USERNAME=admin
    - MONGO_INITDB_ROOT_PASSWORD=password
   volumes:
    - mongodb_data:/data/db
    
 mongo-express:
    image: mongo-express:latest
    ports:
     - 8080:8081
    environment:
     - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
     - ME_CONFIG_MONGODB_ADMINPASSWORD=password
     - ME_CONFIG_MONGODB_SERVER=mongo
    depends_on:
     - mongo

volumes:
  mongodb_data: 

 