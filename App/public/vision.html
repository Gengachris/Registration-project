<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision - Student Portal</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h2>My Vision & Goals</h2>
            <div id="visionContent">
                <div id="userInfo">
                    <p>Loading...</p>
                </div>
                <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; margin-top: 20px;">
                    <h3 style="color: #667eea; margin-bottom: 15px;">Goals for Success:</h3>
                    <ol style="line-height: 1.8; color: #333; padding-left: 25px;">
                        <li>Doing Assignments on time</li>
                        <li>Hands on practice</li>
                        <li>Collaborating with others</li>
                    </ol>
                </div>
            </div>
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button onclick="goBack()" class="btn">Back to About</button>
                <button onclick="logout()" class="btn btn-logout">Logout</button>
            </div>
        </div>
    </div>
    <script src="js/vision.js"></script>
</body>
</html>
